<title>Мой ВНЖ — дни, поездки и документы семьи</title>
<style>
:root{--bg:#f5f4f1;--card:#fff;--card2:#faf9f7;--text:#1e2227;--muted:#6c7178;--line:#e5e2dc;--accent:#3d6b8a;--home:#3e8b5c;--abroad:#c2554f;--travel:#d08a2b;--plan:#5b7fc7;--fs:17px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
:root[data-theme=graphite]{--bg:#141619;--card:#1e2125;--card2:#252a2f;--text:#e9e7e3;--muted:#9aa0a8;--line:#30353b;--accent:#7eb1d1;--home:#5fb381;--abroad:#e07a73;--travel:#e3a94f;--plan:#8ea8ef;--shadow:none}
:root[data-theme=indigo]{--bg:#11132a;--card:#1a1d3a;--card2:#21254b;--text:#e6e7f5;--muted:#9da1c4;--line:#2c3058;--accent:#a3adff;--home:#6cc39a;--abroad:#ef8a85;--travel:#f0b35e;--plan:#9fb4ff;--shadow:none}
:root[data-theme=sage]{--bg:#f1f3ee;--card:#fff;--card2:#f7f9f5;--text:#232a22;--muted:#69736a;--line:#dfe4da;--accent:#5a7d5e}
:root[data-theme=powder]{--bg:#f8f1ef;--card:#fff;--card2:#fcf7f6;--text:#2d2324;--muted:#7a6a6b;--line:#ecdeda;--accent:#a35f67}
:root[data-theme=sepia]{--bg:#f3eadb;--card:#fbf6ec;--card2:#f6eee0;--text:#3a2e21;--muted:#7d6c58;--line:#e3d6c1;--accent:#8a6838}
:root[data-theme=sea]{--bg:#eef4f5;--card:#fff;--card2:#f5f9fa;--text:#1d2b30;--muted:#5f7379;--line:#d9e5e8;--accent:#2f7c8a}
:root.hc{--muted:var(--text)}
:root.hc .card,:root.hc .item{border-width:1.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.42;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header#top h1{font-size:1.3em;margin:0;font-weight:700;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:1em;padding:4px 6px 4px 0;display:flex;align-items:center;gap:2px}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;border:0;background:none;color:var(--muted);padding:7px 0 5px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button.on{color:var(--accent);font-weight:600}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:1.02em;margin:0 0 10px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3{font-size:.95em;margin:14px 0 6px}
.muted{color:var(--muted)}.small{font-size:.84em}.tiny{font-size:.74em}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.45em;line-height:1.15;font-weight:700}
.stat span{font-size:.74em;color:var(--muted)}
.c-home{color:var(--home)}.c-abroad{color:var(--abroad)}.c-travel{color:var(--travel)}.c-plan{color:var(--plan)}.c-acc{color:var(--accent)}
.hero{border-radius:var(--r);padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--home),color-mix(in srgb,var(--home) 70%,#000))}
.hero.abroad{background:linear-gradient(135deg,var(--abroad),color-mix(in srgb,var(--abroad) 70%,#000))}
.hero .big{font-size:1.5em;font-weight:700;line-height:1.2}
.hero .sub{opacity:.92;font-size:.9em;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:550;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--abroad)}
.btn.block{width:100%}.btn.sm{min-height:34px;padding:6px 11px;font-size:.88em;border-radius:10px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74em;color:var(--text)}
.qa button svg{width:22px;height:22px;color:var(--accent)}
.bar{height:9px;background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar i.ok{background:var(--home)}.bar i.warn{background:var(--travel)}.bar i.over{background:var(--abroad)}
.rule{padding:10px 0;border-top:1px solid var(--line)}.rule:first-of-type{border-top:0;padding-top:2px}
.badge{display:inline-block;font-size:.72em;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:550}
.badge.ok{color:var(--home);border-color:color-mix(in srgb,var(--home) 40%,transparent)}
.badge.warn{color:var(--travel);border-color:color-mix(in srgb,var(--travel) 40%,transparent)}
.badge.over{color:var(--abroad);border-color:color-mix(in srgb,var(--abroad) 40%,transparent)}
.badge.plan{color:var(--plan);border-color:color-mix(in srgb,var(--plan) 40%,transparent)}
.badge.acc{color:var(--accent)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item.planned{border-style:dashed}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.15em;flex:none}
.item .tx{flex:1;min-width:0}.item .t1{font-weight:600}.item .t2{font-size:.84em;color:var(--muted)}
.menu .item{margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:.86em;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ygroup{font-weight:700;margin:16px 2px 8px;color:var(--muted);font-size:.86em;text-transform:uppercase;letter-spacing:.05em}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:.82em;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:max(16px,1em);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetWrap.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.shead h2{margin:0;font-size:1.15em;flex:1}
.xbtn{border:0;background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:1.1em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88em;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:.95}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72em;color:var(--muted);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.88em;background:var(--card);border:1px solid var(--line);position:relative;cursor:pointer}
.cal .d.e{visibility:hidden}
.cal .d.home{background:color-mix(in srgb,var(--home) 16%,var(--card))}
.cal .d.abroad{background:color-mix(in srgb,var(--abroad) 22%,var(--card))}
.cal .d.travel{background:color-mix(in srgb,var(--travel) 26%,var(--card))}
.cal .d.plan{background:color-mix(in srgb,var(--plan) 16%,var(--card));border-style:dashed}
.cal .d.out{opacity:.45}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.cal .d .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78em;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;font-size:.7em;line-height:1.25}
.th .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--muted)}
.th .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1}
.mini{display:flex;gap:6px;flex-wrap:wrap}.mini .th{width:76px;aspect-ratio:3/4}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88em}
.hbar .nm{width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:7px}
.hbar .vl{width:24%;text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.62em;color:var(--muted);gap:3px}
.vbars div i{width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:7;display:flex;align-items:center;justify-content:center}
details.g{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
details.g summary{padding:13px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.g summary::-webkit-details-marker{display:none}
details.g summary:after{content:"›";margin-left:auto;color:var(--muted);font-size:1.3em;transition:transform .2s}
details.g[open] summary:after{transform:rotate(90deg)}
details.g .gb{padding:0 0 14px;font-size:.94em}
details.g .gb p{margin:6px 0}details.g .gb ul,details.g .gb ol{margin:6px 0;padding-left:20px}details.g .gb li{margin:4px 0}
.note{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
.warnbox{background:color-mix(in srgb,var(--travel) 12%,var(--card));border:1px solid color-mix(in srgb,var(--travel) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
.copy{text-align:center;color:var(--muted);font-size:.76em;margin:22px 0 6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
table.t{width:100%;border-collapse:collapse;font-size:.84em}
table.t th,table.t td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-size:.72em;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:5px}
.themes button.on{border-color:var(--accent)}
.themes button i{width:34px;height:22px;border-radius:7px;display:block;border:1px solid rgba(0,0,0,.08)}
#viewer{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vt{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff;align-items:center}
#viewer .vt button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px}
#viewer .vi{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
#viewer img{max-width:100%;max-height:100%}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock.on{display:flex}
#lock .dots{display:flex;gap:14px}#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}#lock .dots i.f{background:var(--accent)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
#lock .pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.5em}
#print{display:none}
@media print{
 body.printing>*:not(#print){display:none!important}
 body.printing{background:#fff!important}
 body.printing #print{display:block;color:#000;font:11pt/1.4 -apple-system,"Segoe UI",Arial,sans-serif}
}
#print h1{font-size:18pt;margin:0 0 4px}#print h2{font-size:13pt;margin:18px 0 6px;border-bottom:1.5px solid #333;padding-bottom:3px}
#print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4px 0}
#print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
#print th{background:#eef2f5}
#print .ph{display:inline-block;width:31%;margin:0 1% 10px;vertical-align:top;page-break-inside:avoid;font-size:8.5pt}
#print .ph img{width:100%;border:1px solid #ccc}
#print .meta{color:#444;font-size:9.5pt}
@media (min-width:700px){.thumbs{grid-template-columns:repeat(4,1fr)}}

:root{--zone:#7a64b8}:root[data-theme=graphite]{--zone:#a996e6}:root[data-theme=indigo]{--zone:#b7a6ff}
.cal .d.zone{background:color-mix(in srgb,var(--zone) 24%,var(--card))}
.hid{display:none!important}
.pbar{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}.pbar::-webkit-scrollbar{display:none}
.pchip,.pchk span{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px 6px 9px;font-size:.86em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.pchip i,.pchk span i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pchip.on,.pchk input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--card));font-weight:650}
.pchip.add{color:var(--accent);padding-left:12px}
.pchk input{display:none}
.sw input{display:none}.sw i{display:block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw input:checked+i{border-color:var(--text)}
.th.land{aspect-ratio:1.58/1}
.gap{margin:0 0 8px 18px;padding:6px 12px;border-left:3px dashed var(--abroad);font-size:.82em;color:var(--muted);cursor:pointer}
.alertbox{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:color-mix(in srgb,var(--abroad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--abroad) 35%,transparent)}
.alertbox h2{font-size:1em;margin:0 0 6px;color:var(--abroad)}
.alertbox .al{font-size:.88em;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--abroad) 18%,transparent)}.alertbox .al:first-of-type{border-top:0}
.alertbox .al.info{color:var(--muted)}
nav#tabs button{position:relative}.tbadge{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--abroad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.icons button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72em}
.icons button.on{border-color:var(--accent)}.icons img{width:56px;height:56px;border-radius:13px;display:block}
#viewer .vhint,#editor .vhint{color:#aaa;text-align:center;font-size:.75em;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
#viewer .vi{cursor:zoom-out}
#editor{position:fixed;inset:0;background:#111;z-index:35;display:none;flex-direction:column}#editor.on{display:flex}
#editor .vt{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff;align-items:center}
#editor .vt button,#editor .edbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:9px 13px;font-size:.92em}
#editor .vt .edok{background:var(--accent)}
#edStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:18px;touch-action:none}
#edStage canvas.edc{max-width:100%;max-height:100%;display:block}
#edCrop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}

const DB={d:null,

 tx(st,mode,fn){return new Promise((ok,no)=>{const t=DB.d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q?q.result:undefined);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
 get(st,k){return DB.tx(st,'readonly',s=>s.get(k))},
 put(st,k,v){return DB.tx(st,'readwrite',s=>s.put(v,k))},
 del(st,k){return DB.tx(st,'readwrite',s=>s.delete(k))},
 keys(st){return DB.tx(st,'readonly',s=>s.getAllKeys())},
 clear(st){return DB.tx(st,'readwrite',s=>s.clear())}};

function trackStart(pid=act()){const p=prof(pid);if(SM()){const st=staysOf(pid);if(st.length){const f=dn(st[0].entry);return p.trackFrom?Math.max(f,dn(p.trackFrom)):f}}if(p.trackFrom)return dn(p.trackFrom);if(p.permitStart)return dn(p.permitStart);const t=tripsOf(pid).filter(x=>!x.planned).map(x=>dn(x.dep));return t.length?Math.min(...t):TD()}
function statusMap(trips,withPlan){const m=new Map(),T=TD();
 for(const t of trips){if(t.planned&&!withPlan)continue;if(!t.dep)continue;const a=dn(t.dep);const open=!t.ret;const b=open?Math.max(a,t.planned?a:T):dn(t.ret);
  for(let d=a;d<=b;d++){const tr=d===a||(!open&&d===b);const st=tr?'travel':'abroad';const prev=m.get(d);
   if(!prev||(prev.s==='travel'&&st==='abroad'))m.set(d,{s:st,t,z:!!t.schengen,p:!!t.planned})}}
 return m}

function countRange(m,a,b,hs=true){const r={home:0,abroad:0,travel:0,present:0,absent:0,sch:0,zone:0,non:0,days:Math.max(0,b-a+1)};
 for(let d=a;d<=b;d++){const e=m.get(d);r[e?e.s:'home']++;if(absent(e))r.absent++;else r.present++;
  if(!e){if(hs)r.sch++}else if(e.s==='travel'){if(hs||e.z)r.sch++}else if(e.z){r.zone++;r.sch++}else r.non++}
 return r}
function tripInfo(t){const T=TD();const a=dn(t.dep),b=t.ret?dn(t.ret):Math.max(a,T);const open=!t.ret;const travel=open?1:(a===b?1:2);const full=open?Math.max(0,b-a):Math.max(0,b-a-1);const abs=S.settings.travelAs==='abroad'?full+travel:full;const docs=S.docs.filter(x=>x.tripId===t.id||(t.stayId&&((x.tripId===t.stayId&&x.leg!=='in')||(x.tripId===t.nextId&&x.leg==='in')))).length;return{a,b,open,travel,full,abs,docs,total:b-a+1}}

function evalAll(m,R,o={}){const pid=o.pid||act();const pr=prof(pid);
 const A=Math.min(trackStart(pid),R-1900);const n=R-A+1;
 const ab=new Uint8Array(n),Pa=new Int32Array(n+1),Pz=new Int32Array(n+1);
 for(let i=0;i<n;i++){const e=m.get(A+i);ab[i]=absent(e)?1:0;Pa[i+1]=Pa[i]+ab[i];Pz[i+1]=Pz[i]+(e&&e.z?1:0)}
 const cnt=(P,a,b)=>{a=Math.max(a,A);b=Math.min(b,R);return b<a?0:P[b-A+1]-P[a-A]};
 const st=(v,l)=>v>l?'over':v>=l*.8?'warn':'ok';
 return S.rules.filter(r=>r.on).map(r=>{const res={r,limit:+r.limit||0};
  if(r.type==='consec'){const ce=o.curEnd??R;let best=0,bEnd=0,run=0,cr=0;for(let i=0;i<n;i++){if(ab[i]){run++;if(run>best){best=run;bEnd=A+i}}else run=0;if(A+i===ce)cr=run}
   run=ce>=R?run:cr;res.cur=run;res.best=best;res.bestEnd=bEnd;res.value=o.cur?run:best;res.left=res.limit-run;res.status=st(res.value,res.limit);
   res.text=o.cur?`Отсутствие подряд: ${dd(run)} из ${res.limit}`:`Максимум подряд: ${dd(best)} из ${res.limit}`+(run?` · сейчас ${dd(run)}`:'');}
  else if(r.type==='period'){const P=+r.period||1826,ps=pr.permitStart,anc=r.anchor==='start'&&ps;
   const win=d=>{if(anc){const s0=dn(ps);const k=Math.max(0,Math.floor((d-s0)/P));return[s0+k*P,s0+k*P+P-1]}return[d-P+1,d]};
   let[a,b]=win(R);let v=cnt(Pa,a,Math.min(b,R));
   if(o.zFrom!=null){if(anc){for(let d=o.zFrom,g=0;g<20;g++){const[wa,wb]=win(d);const c=cnt(Pa,wa,Math.min(wb,R));if(c>v){v=c;a=wa;b=wb}if(wb>=R)break;d=wb+1}}
    else for(let d=o.zFrom;d<=R;d++){const c=cnt(Pa,d-P+1,d);if(c>v){v=c;a=d-P+1;b=d}}}
   res.value=v;res.from=a;res.to=b;res.left=res.limit-res.value;res.status=st(res.value,res.limit);
   res.text=`Отсутствие: ${dd(res.value)} из ${res.limit} · окно ${fdn(a)} — ${fdn(b)}`;}
  else if(r.type==='zone'){const P=+r.period||180;const val=d=>cnt(Pz,d-P+1,d);res.value=val(R);let mx=res.value;
   if(o.zFrom!=null){mx=0;for(let d=o.zFrom;d<=R;d++){const v=val(d);if(v>mx)mx=v}res.value=mx}
   res.left=res.limit-res.value;res.status=st(res.value,res.limit);res.text=`В других странах Шенгена за ${P} дн.: ${dd(res.value)} из ${res.limit}`;}
  else if(r.type==='minyear'){const y=ds(R).slice(0,4);const a=dn(y+'-01-01'),b=dn(y+'-12-31');const end=o.fullYear?b:Math.min(b,R);
   const abs=cnt(Pa,Math.max(a,A),end);const span=end-a+1;res.value=span-abs;const rest=o.fullYear?0:b-R;
   res.status=res.value>=res.limit?'ok':(res.value+rest<res.limit?'over':'prog');res.left=res.limit-res.value;
   res.text=`В стране в ${y} г.: ${dd(res.value)} из ${res.limit}`+(res.status==='prog'?` · нужно ещё ${dd(res.left)}`:'');}
  res.pct=res.limit?Math.min(1.2,res.value/res.limit):0;return res})}
function worst(rs){const o={over:3,warn:2,prog:1,ok:0};return rs.reduce((w,x)=>o[x.status]>o[w]?x.status:w,'ok')}
function latestReturn(draft,others,pid=act()){const a=dn(draft.dep);
 const ok=ret=>{const t={...draft,ret:ds(ret),planned:true};const m=statusMap([...others,t],true);
  const rs=evalAll(m,ret,{pid,cur:true,curEnd:S.settings.travelAs==='abroad'?ret:ret-1,zFrom:a});
  return rs.every(x=>x.r.type==='minyear'||x.status!=='over')};
 if(!ok(a))return null;let lo=a,hi=a+1100;if(ok(hi))return hi;
 while(hi-lo>1){const mid=(lo+hi)>>1;if(ok(mid))lo=mid;else hi=mid}return lo}
function coverage(a,b,pid=act()){const m=mapNow(false,pid);const hs=homeSch(pid);const dc=docsOf(pid);const out=[];if(b<a)return out;let y=+ds(a).slice(0,4),mo=+ds(a).slice(5,7);
 for(let g=0;g<400;g++){const first=dn(`${y}-${pad(mo)}-01`);const next=mo===12?dn(`${y+1}-01-01`):dn(`${y}-${pad(mo+1)}-01`);const s=Math.max(a,first),e=Math.min(b,next-1);if(s>b)break;
  const c=countRange(m,s,e,hs);const key=`${y}-${pad(mo)}`;const docs=dc.filter(x=>x.date&&x.date.slice(0,7)===key).length;out.push({key,y,mo,...c,docs});mo++;if(mo>12){mo=1;y++}}
 return out}

async function processFile(f){
 if(f.type&&f.type.startsWith('image/')){try{const img=await loadImage(f);const w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,1800/Math.max(w,h));const cw=Math.round(w*k),ch=Math.round(h*k);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(img,0,0,cw,ch);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const tk=Math.min(1,360/Math.max(cw,ch));const t=document.createElement('canvas');t.width=Math.round(cw*tk);t.height=Math.round(ch*tk);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  return{id:uid(),blob,mime:'image/jpeg',w:cw,h:ch,name:(f.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',thumb:t.toDataURL('image/jpeg',.7)}}catch(e){}}

const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
const dataURLToBlob=u=>{const[h,d]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})};

function ruleRow(x){const cls=x.status==='prog'?'':x.status;const lab={ok:'в норме',warn:'близко к лимиту',over:x.r.type==='minyear'?'не набрать':'превышено',prog:'в процессе'}[x.status];
 return`<div class="rule"><div class="row"><b class="sp" style="font-weight:600">${esc(x.r.name)}</b><span class="badge ${cls}">${lab}</span></div><div class="bar"><i class="${cls}" style="width:${Math.min(100,x.pct*100).toFixed(1)}%"></i></div><div class="small muted">${esc(x.text)}</div></div>`}
function deadlineList(pid=act()){const p=prof(pid),T=TD(),L=[];
 const add=(name,d,sub)=>{if(d!=null&&!isNaN(d))L.push({name,d,left:d-T,sub,pid})};
 if(p.cardTo){const e=dn(p.cardTo);add((p.cardKind==='pmzh'?'Карта ПМЖ':'Карта ВНЖ')+' действует до',e);if(p.cardKind!=='pmzh'){const a=e-(+p.renewFrom||60),b=e-(+p.renewTo||14);
  let sub=T<a?`окно откроется через ${dd(a-T)}`:T<=b?`окно открыто, осталось ${dd(b-T)}`:T<=e?'окно закрыто — срочно в миграцию':'карта истекла';
  L.push({name:`Подача на продление: ${fdn(a)} — ${fdn(b)}`,d:b,left:b-T,sub,pid})}}
 if(p.permitStart&&p.cardKind!=='pmzh')add(`${p.pmzhYears||5} лет ВНЖ — право на ПМЖ`,addY(p.permitStart,+p.pmzhYears||5),'подавать минимум за 3–4 месяца до окончания текущей карты');
 if(p.passportTo)add('Загранпаспорт действует до',dn(p.passportTo),'менять заранее: карта ВНЖ привязана к паспорту');
 if(p.insuranceTo)add('Медстраховка до',dn(p.insuranceTo));
 const kinds={};for(const x of S.ids.filter(i=>i.personId===pid&&i.validTo&&!RESKINDS.includes(i.kind)&&i.kind!=='passport'&&i.kind!=='ins'))if(!kinds[x.kind]||x.validTo>kinds[x.kind].validTo)kinds[x.kind]=x;
 for(const x of Object.values(kinds))add(IDKINDS[x.kind]+' — до',dn(x.validTo),x.number?'№ '+x.number:'');
 for(const x of S.deadlines)if(x.date&&(!x.personId||x.personId===pid))add(x.name+(x.personId?'':' (вся семья)'),dn(x.date),x.note);
 return L.sort((a,b)=>a.d-b.d)}
function dlRow(x){const c=x.left<0?'over':x.left<=30?'warn':'ok';const l=x.left<0?`прошло ${dd(-x.left)}`:x.left===0?'сегодня':`через ${dd(x.left)}`;
 return`<div class="rule"><div class="row"><span class="sp">${esc(x.name)}</span><span class="badge ${c}">${l}</span></div><div class="small muted">${fdn(x.d)}${x.sub?' · '+esc(x.sub):''}</div></div>`}
let ALERTS=[];
function alertsFor(pid){const T=TD(),th=+S.settings.warnDays||14,out=[],seen=new Set();const p=person(pid);const m=mapNow(false,pid);const e=m.get(T);const rs=evalAll(m,T,{pid,cur:true});
 const push=(lvl,t,k)=>{if(k&&seen.has(k))return;if(k)seen.add(k);out.push({lvl,t,pid,name:p.name})};
 if(e&&e.s!=='home'){const c=rs.find(x=>x.r.type==='consec');if(c&&c.left<=th)push(c.left<0?'over':'warn',c.left<0?`превышен лимит «${c.r.name}» на ${dd(-c.left)}`:`до лимита «${c.r.name}» осталось ${dd(c.left)}`,c.r.id);
  if(!e.t.ret){const lr=latestReturn(e.t,tripsOf(pid).filter(x=>x.id!==e.t.id),pid);if(lr!=null&&lr-T<=th)push(lr<T?'over':'warn',`вернуться из поездки (${e.t.country||'за границей'}) не позже ${fdn(lr)}${lr>=T?' — через '+dd(lr-T):''}`,'lr')}}
 for(const x of rs){if((x.r.type==='zone'||x.r.type==='period')&&x.left<=th)push(x.left<0?'over':'warn',x.left<0?`превышен лимит «${x.r.name}»: ${x.text}`:`до лимита «${x.r.name}» осталось ${dd(x.left)}`,x.r.id)}
 for(const t of tripsOf(pid).filter(t=>t.planned&&t.ret&&dn(t.ret)>=T)){const mm=statusMap(tripsOf(pid),true);const R2=dn(t.ret);const r2=evalAll(mm,R2,{pid,cur:true,curEnd:S.settings.travelAs==='abroad'?R2:R2-1,zFrom:dn(t.dep)}).filter(x=>x.status==='over'&&x.r.type!=='minyear');
  if(r2.length)push('over',`запланированная поездка ${t.country||''} ${fd(t.dep)} — ${fd(t.ret)} нарушит: ${r2.map(x=>'«'+x.r.name+'»').join(', ')}`)}
 for(const x of deadlineList(pid)){if(/^Подача на продление/.test(x.name)){if(/^окно открыто/.test(x.sub))push('warn',`подача на продление: ${x.sub}`);else if(/^окно закрыто/.test(x.sub))push('over','окно подачи на продление закрылось, а карта ещё действует — срочно в миграцию');continue}if(x.left>=0&&x.left<=th)push('info',`${x.name}: ${x.left===0?'сегодня':'через '+dd(x.left)}`)}
 for(const x of []) if(x.left>=0&&x.left<=th)push('info',`${x.name}: ${x.left===0?'сегодня':'через '+dd(x.left)}`);
 return out}

 if(!S.settings.onboarded)return vWelcome();
 const m=mapNow(false),e=m.get(T);const y=new Date().getFullYear();const hs=homeSch();const A=trackStart();const ys=countRange(m,Math.max(A,dn(y+'-01-01')),T,hs);const all=countRange(m,A,T,hs);
 const rs=evalAll(m,T,{pid});let hero;const nm=multi()?esc(person().name)+' · ':'';
 if(e&&e.s!=='home'){const t=e.t;const k=T-dn(t.dep)+1;const others=tripsOf(pid).filter(x=>x.id!==t.id);const lr=t.ret?null:latestReturn({...t},others,pid);const c=rs.find(x=>x.r.type==='consec');
  hero=`<div class="hero abroad"><div class="small" style="opacity:.85">${nm}Сейчас</div><div class="big">За границей · ${esc(t.country||'поездка')}</div><div class="sub">${t.schengen?'Шенгенская зона':'Вне Шенгена'} · ${dd(k)} в поездке с ${fd(t.dep)}${t.ret?' · возвращение '+fd(t.ret):''}</div>${c?`<div class="sub">Можно отсутствовать подряд ещё: <b>${dd(Math.max(0,c.left))}</b></div>`:''}${lr!=null?`<div class="sub">Вернуться не позже: <b>${fdn(lr)}</b></div>`:''}</div>`}
 else{let last=null;for(const t of tripsOf(pid))if(!t.planned&&t.ret&&dn(t.ret)<=T&&(!last||t.ret>last.ret))last=t;const since=last?T-dn(last.ret):T-A;
  hero=`<div class="hero"><div class="small" style="opacity:.85">${nm}Сейчас</div><div class="big">В стране · ${esc(pr.country||'')}</div><div class="sub">${last?`Без выездов ${dd(since)} (с ${fd(last.ret)})`:`Учёт ведётся с ${fdn(A)}`}</div></div>`}
 const cov=coverage(Math.max(A,T-364),T);const covOk=cov.filter(x=>x.present===0||x.docs>0).length;
 const dls=deadlineList().filter(x=>x.left>=-30).slice(0,6);

 const lb=S.meta.lastBackup?T-dn(S.meta.lastBackup):null;const hasData=S.trips.length+S.docs.length+S.expenses.length+S.ids.length>0;
 let fam='';if(multi()){fam=`<div class="card"><h2>${ico('family')}Семья сегодня</h2>${S.people.map(p=>{const mm=mapNow(false,p.id);const ee=mm.get(T);const r2=evalAll(mm,T,{pid:p.id});const w=worst(r2);const yy=countRange(mm,Math.max(trackStart(p.id),dn(y+'-01-01')),T,homeSch(p.id));
  return`<div class="item" data-a="pSel" data-id="${p.id}" style="margin-bottom:6px"><div class="ic" style="background:${p.color};color:#fff;font-weight:700">${esc(p.name.slice(0,1))}</div><div class="tx"><div class="t1">${esc(p.name)}</div><div class="t2">${ee&&ee.s!=='home'?`<span class="c-abroad">за границей · ${esc(ee.t.country||'')}</span>`:'в стране'} · ${y}: ${yy.present} дн. в стране, ${yy.abroad} за границей</div></div><span class="badge ${w==='prog'?'':w}">${{ok:'норма',warn:'внимание',over:'превышено',prog:'норма'}[w]}</span></div>`}).join('')}</div>`}
 return`${alertBox()}${hero}
 <div class="qa"><button data-a="tripNew">${ico('trips','')}Поездка</button><button data-a="docNew">${ico('cam','')}Документ</button><button data-a="expNew">${ico('money','')}Расход</button><button data-a="sub" data-id="planner">${ico('plan','')}Планировщик</button></div>

 const blob=await new Promise(r=>o.toBlob(r,'image/jpeg',.85));const tk=Math.min(1,360/Math.max(o.width,o.height));const t=document.createElement('canvas');t.width=Math.round(o.width*tk);t.height=Math.round(o.height*tk);t.getContext('2d').drawImage(o,0,0,t.width,t.height);
 const res={blob,mime:'image/jpeg',w:o.width,h:o.height,thumb:t.toDataURL('image/jpeg',.7)};const cb=ED.onDone;edClose();await cb(res)}

 <div class="card"><h2>Восстановить</h2><p class="small">Выберите ранее сохранённый файл копии (.json). Подходят и копии версии 1.0.</p><label class="chk"><input type="radio" name="bkm" value="merge" checked> Объединить с текущими данными</label><label class="chk"><input type="radio" name="bkm" value="replace"> Заменить все текущие данные</label><label class="btn block">Выбрать файл копии<input type="file" id="bk_file" accept=".json,application/json" hidden></label></div>
 <div class="card"><h2>Перенос на другое устройство</h2><p class="small muted">Создайте копию на старом телефоне → отправьте файл себе (AirDrop, Telegram, почта) → на новом устройстве установите приложение и восстановите копию здесь. Так же можно вести учёт семьи на телефонах супругов: обменивайтесь копиями в режиме «Объединить».</p></div>

 ${s.cats.map(c=>`<div class="row" style="margin-bottom:6px"><input type="text" data-cat="${c.id}" value="${esc(c.n)}"><button class="btn sm" data-a="catDel" data-id="${c.id}">×</button></div>`).join('')}<button class="btn block" data-a="catAdd">+ Статья расходов</button></div>
 <div class="card"><h2>${ico('lock')}Защита PIN-кодом</h2><p class="small muted">PIN спрашивается при открытии приложения. Если забыть PIN, войти можно будет только удалив данные — держите резервную копию.</p>${s.pinHash?'<button class="btn block danger" data-a="pinOff">Отключить PIN</button>':'<div class="grid2"><input type="password" inputmode="numeric" maxlength="6" id="s_pin" placeholder="4–6 цифр"><button class="btn" data-a="pinOn">Включить</button></div>'}</div>
 <div class="card"><h2>⚠ Предупреждения</h2><label class="f"><span>Предупреждать заранее — за сколько дней до лимита или срока</span><select id="s_warn">${[7,10,14,21,30,45,60].map(d=>`<option value="${d}" ${+s.warnDays===d?'selected':''}>за ${dd(d)}</option>`).join('')}</select></label>
 <p class="small muted">Предупреждения показываются вверху «Обзора» (по всей семье) и цифрой на вкладке: до лимита «6 месяцев подряд», «90/180», «за 5 лет», крайняя дата возвращения, запланированные поездки с нарушением, окончание карт, прав, паспорта, окно продления.</p>
 ${'Notification' in window?(s.notify&&Notification.permission==='granted'?'<div class="row"><span class="sp small c-home">✓ Уведомления на телефоне включены</span><button class="btn sm" data-a="notifyOff">Выключить</button></div>':'<button class="btn pri block" data-a="notifyOn">🔔 Включить уведомления на телефоне</button>'):'<div class="small muted">Этот браузер не поддерживает уведомления. На iPhone они работают для приложения, установленного на экран «Домой» (iOS 16.4 и новее).</div>'}

 <div class="card"><h2>Иконка на экране «Домой»</h2><div class="icons">${[['d','Монограмма'],['a','Паспорт'],['b','Штамп'],['c','Календарь']].map(([k,n])=>`<button class="${(localGet('dni-icon')||'d')===k?'on':''}" data-a="icon" data-id="${k}"><img src="icons/icon-${k}-192.png" alt=""><span>${n}</span></button>`).join('')}</div>
 <div class="warnbox">Как поменять иконку на iPhone: 1) сохраните резервную копию; 2) выберите иконку здесь; 3) удалите старую иконку с экрана «Домой» (вместе с ней iPhone удаляет данные приложения); 4) откройте приложение в Safari → «Поделиться» → «На экран „Домой“» — там же можно изменить название; 5) восстановите резервную копию.</div></div>
 <div class="card"><button class="btn block" data-a="onboardAgain">Показать приветствие заново</button></div>`}

const G=(t,b,open)=>`<details class="g" ${open?'open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`;
function vGuide(){return`<button class="btn pri block" style="margin-bottom:12px" data-a="tourStart">🎓 Пройти обучающий тур</button>`+G('1. Установка на телефон',`<p><b>iPhone / iPad:</b></p><ol><li>Откройте приложение в браузере <b>Safari</b>.</li><li>Нажмите кнопку «Поделиться» (квадрат со стрелкой вверх).</li><li>Выберите «На экран „Домой“» → «Добавить».</li><li>Запускайте приложение только с иконки «Мой ВНЖ» — так оно работает как обычное приложение и без интернета.</li></ol><p><b>Android:</b> Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p><div class="note">Данные хранятся внутри установленного приложения. Если открыть его в браузере отдельно — там будет пустая копия. Всегда пользуйтесь иконкой.</div>`,true)
+G('2. Первый запуск и семья',`<p>При первом запуске укажите своё имя, <b>свою страну ВНЖ</b> (любую — Болгария, Сербия, Испания, Кипр, Турция…), дату первого ВНЖ и срок карты. Затем нажмите <b>«+ член семьи»</b> над экраном и добавьте супруга, детей, родителей — у каждого своё имя и цвет.</p><p>Строка с именами вверху «Обзора», «Поездок», «Календаря» и «Документов» переключает, <b>чьи</b> данные вы видите. Каждый член семьи считается отдельно: свои дни, лимиты, карты и сроки — ведь члены семьи могут уезжать в разное время и на разный срок.</p><p>На «Обзоре» блок <b>«Семья сегодня»</b> показывает всех сразу: кто где находится и у кого лимиты близки к превышению.</p><p>Новому члену семьи можно скопировать страну, даты ВНЖ и адрес, а также сразу добавить его во все ваши поездки.</p>`)
+G('3. Как считаются дни: страна ВНЖ и Шенген отдельно',`<ul><li><b>В стране ВНЖ</b> (например, «в Болгарии») — дни, когда вы не в поездке, плюс дни выезда/въезда (по настройке).</li><li><b>В дороге</b> — день выезда и день возвращения каждой поездки.</li><li><b>В других странах Шенгена</b> — полные дни поездок в страны зоны (Греция, Румыния, Германия…).</li><li><b>Вне Шенгена</b> — полные дни в Турции, России, Сербии и других странах вне зоны.</li><li><b>В Шенгенской зоне всего</b> — если ваша страна ВНЖ в Шенгене (Болгария, Греция, Испания…): она сама + другие страны зоны + дни в дороге. Если не в Шенгене (Сербия, Черногория, Турция…) — только поездки в страны зоны.</li></ul><p>Пример: выезд 10 мая в Турцию, возвращение 15 мая → 2 дня в дороге (10 и 15), 4 дня вне Шенгена (11–14). Если бы это была Греция — 4 дня в других странах Шенгена.</p><p>Как учитывать дни в дороге, выбирается в «Правилах подсчёта»: <b>как дни в стране</b> (обычная практика) или <b>как отсутствие</b> (строгий режим). Для Шенгена 90/180 дни въезда и выезда всегда идут в счёт пребывания в зоне.</p><p>В календаре: зелёный — страна ВНЖ, фиолетовый — другие страны Шенгена, красный — вне Шенгена, оранжевый — в дороге.</p>`)
+G('4а. Два способа ввода: «въезд → выезд» или «выезд → въезд»',`<p><b>Въезд → выезд</b> (по умолчанию): вносите каждый <b>въезд в страну</b> ВНЖ — дату, транспорт, пункт пропуска, откуда прибыли, — а когда уезжаете, открываете эту запись и отмечаете <b>выезд</b>: дату, пункт пропуска и куда выехали. Пока выезда нет, стоит отметка «Ещё в стране». Время от выезда до следующего въезда приложение само считает поездкой за границу и показывает между записями пунктиром.</p><p><b>Выезд → въезд</b>: вносите каждую поездку — выехали и вернулись.</p><p>Дни, лимиты, календарь и отчёты считаются одинаково. Переключение — «Ещё → Правила подсчёта» → «Как вносить данные»; уже внесённое переводится в новый формат автоматически.</p>`)
+G('4. Поездки и пункты пропуска',`<ol><li>«Поездки» → «+».</li><li>Отметьте, <b>кто едет</b> (или «Вся семья»). Общую поездку достаточно внести один раз.</li><li>Страна поездки — отметка «Шенген» ставится автоматически.</li><li><b>Выезд:</b> дата, транспорт, пункт пропуска.</li><li><b>Въезд обратно:</b> дата, транспорт, пункт пропуска — или «Ещё не вернулись», тогда дни считаются по сегодняшний.</li><li>Цель, заметка (рейс, номер билета), фото билетов и посадочных.</li></ol><p><b>Пункты пропуска</b> выбираются из списка: сначала «Ранее внесённые» (то, что вы уже выбирали), затем направления, связанные со страной поездки, затем все остальные отмеченные. Если нужного пункта нет — «✎ Ввести свой пункт пропуска», он запомнится.</p><p>Какие направления показывать, задаётся в «Ещё → Страны и погранпереходы»: отметьте страны, куда ездите, — и в списке появятся все их аэропорты и переходы с Болгарией.</p>`)
+G('5. Календарь',`<p>Каждый день выбранного члена семьи окрашен по статусу, пунктир — запланированные поездки, точка — есть документ. Нажмите на день: детали, пункт пропуска, документы, кнопки «Документ на эту дату» и «Поездка с даты». Под календарём — итоги месяца и года с разбивкой Болгария / Шенген / вне Шенгена.</p>`)
+G('6. Карты ВНЖ, паспорта, водительские права',`<p>«Документы» → «Карты ВНЖ, паспорта, права» (или «Ещё»). Добавляйте:</p><ul><li><b>первую карту ВНЖ</b> и <b>каждое продление</b> отдельно, затем карту ПМЖ;</li><li>загранпаспорт и внутренний паспорт;</li><li><b>водительские права РФ</b>, <b>зарубежные (болгарские) права</b>, международное удостоверение;</li><li>страховку, визу D и другие документы.</li></ul><p>К каждому — скан <b>лицевой</b> и <b>оборотной</b> стороны, номер, даты выдачи и окончания. Даты окончания автоматически появляются в «Сроках», самая поздняя карта ВНЖ становится действующей, а дата первой карты — началом 5-летнего срока для ПМЖ. Сканы можно включить в отчёт Word/PDF.</p>`)
+G('7. Документы — доказательства присутствия',`<p>Миграционная служба может запросить подтверждение, что вы действительно жили в стране. Лучшие доказательства: билеты, посадочные, штампы; чеки, оплаты картой, выписки; коммунальные счета, договор аренды; визиты к врачу, справки.</p><p>Документ можно отнести к конкретному человеку или ко всей семье (если никто не отмечен). Блок <b>«Подтверждение присутствия»</b> показывает месяцы без документов — нажмите на месяц, чтобы сразу добавить документ.</p>`)
+G('8. Правила, лимиты, планировщик',`<p>Правила общие для семьи и проверяются для каждого отдельно: отсутствие подряд (6 месяцев), отсутствие за 5 лет для ПМЖ, Шенген 90/180 для других стран зоны, 183 дня. Лимиты можно менять и добавлять свои.</p><p><b>Планировщик</b>: введите даты будущей поездки — приложение покажет, не нарушит ли она правила, и рассчитает крайнюю дату возвращения для выбранного человека.</p>`)
+G('9. Сроки, напоминания, чек-лист',`<p>«Сроки» — обратный отсчёт до окончания карты, окна подачи на продление, 5 лет ВНЖ, паспорта, прав, страховки и ваших собственных дат (для человека или всей семьи). «Добавить сроки в Календарь» создаёт файл с напоминаниями за 30 и 7 дней по всей семье.</p><p>«Чек-лист продления» ведётся отдельно для каждого члена семьи.</p>`)

 ACT[a](el.dataset.id,el)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='dq'){docFilter.q=t.value;clearTimeout(ACT._q);ACT._q=setTimeout(()=>{render();const q=$('#dq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},350)}
 if(t.id==='s_fs'){S.settings.fs=+t.value;$('#fsv').textContent=t.value;applySettings();save()}
 if(t.id==='s_tc'){S.settings.textColor=t.value;applySettings();save()}if(t.id==='s_ac'){S.settings.accent=t.value;applySettings();save()}
 if(t.dataset.cat){const c=S.settings.cats.find(x=>x.id===t.dataset.cat);if(c){c.n=t.value;save()}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.cross){const tx=$('#'+t.dataset.cross);if(tx){tx.classList.toggle('hid',t.value!=='__new');if(t.value==='__new')tx.focus()}}
 if(t.id==='dtype'){docFilter.type=t.value;render()}if(t.id==='dyear'){docFilter.year=t.value;render()}
 if(t.id==='s_warn'){S.settings.warnDays=+t.value;save();render()}
 if(t.id==='s_font'){S.settings.font=t.value;applySettings();save()}if(t.id==='s_hc'){S.settings.contrast=t.checked;applySettings();save()}if(t.id==='s_cur'){S.settings.cur=t.value;save()}
 if(t.dataset.rf){const r=S.rules.find(x=>x.id===t.dataset.id);r[t.dataset.rf]=t.tagName==='SELECT'?t.value:(+t.value||0);save()}
 if(t.id==='bk_file'&&t.files[0])backupLoad(t.files[0]).catch(er=>toast('Ошибка: '+er.message))});

/* ---------- Запуск ---------- */
(async()=>{try{await DB.open();const st=await DB.get('kv','state');if(st)loadState(st)}catch(e){toast('Хранилище недоступно: '+e.message)}
 applySettings();render();if(S.settings.pinHash)showLock();notifyCheck();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ALERTS=allAlerts();renderTabs();notifyCheck()}});
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(()=>{if(route.tab==='home'&&!route.sub&&!$('#sheetWrap').classList.contains('on'))render();notifyCheck()},3600000)})();

</script>
</body>
</html>
