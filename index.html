<title>Дни ВНЖ — учёт пребывания</title>
<style>
:root{--bg:#f5f4f1;--card:#fff;--card2:#faf9f7;--text:#1e2227;--muted:#6c7178;--line:#e5e2dc;--accent:#3d6b8a;--home:#3e8b5c;--abroad:#c2554f;--travel:#d08a2b;--plan:#5b7fc7;--fs:17px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:16px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
:root[data-theme=graphite]{--bg:#141619;--card:#1e2125;--card2:#252a2f;--text:#e9e7e3;--muted:#9aa0a8;--line:#30353b;--accent:#7eb1d1;--home:#5fb381;--abroad:#e07a73;--travel:#e3a94f;--plan:#8ea8ef;--shadow:none}
:root[data-theme=indigo]{--bg:#11132a;--card:#1a1d3a;--card2:#21254b;--text:#e6e7f5;--muted:#9da1c4;--line:#2c3058;--accent:#a3adff;--home:#6cc39a;--abroad:#ef8a85;--travel:#f0b35e;--plan:#9fb4ff;--shadow:none}
:root[data-theme=sage]{--bg:#f1f3ee;--card:#fff;--card2:#f7f9f5;--text:#232a22;--muted:#69736a;--line:#dfe4da;--accent:#5a7d5e}
:root[data-theme=powder]{--bg:#f8f1ef;--card:#fff;--card2:#fcf7f6;--text:#2d2324;--muted:#7a6a6b;--line:#ecdeda;--accent:#a35f67}
:root[data-theme=sepia]{--bg:#f3eadb;--card:#fbf6ec;--card2:#f6eee0;--text:#3a2e21;--muted:#7d6c58;--line:#e3d6c1;--accent:#8a6838}
:root[data-theme=sea]{--bg:#eef4f5;--card:#fff;--card2:#f5f9fa;--text:#1d2b30;--muted:#5f7379;--line:#d9e5e8;--accent:#2f7c8a}
:root.hc{--muted:var(--text)}
:root.hc .card,:root.hc .item{border-width:1.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.42;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header#top h1{font-size:1.3em;margin:0;font-weight:700;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--accent);font-size:1em;padding:4px 6px 4px 0;display:flex;align-items:center;gap:2px}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;border:0;background:none;color:var(--muted);padding:7px 0 5px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button.on{color:var(--accent);font-weight:600}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:1.02em;margin:0 0 10px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3{font-size:.95em;margin:14px 0 6px}
.muted{color:var(--muted)}.small{font-size:.84em}.tiny{font-size:.74em}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.45em;line-height:1.15;font-weight:700}
.stat span{font-size:.74em;color:var(--muted)}
.c-home{color:var(--home)}.c-abroad{color:var(--abroad)}.c-travel{color:var(--travel)}.c-plan{color:var(--plan)}.c-acc{color:var(--accent)}
.hero{border-radius:var(--r);padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--home),color-mix(in srgb,var(--home) 70%,#000))}
.hero.abroad{background:linear-gradient(135deg,var(--abroad),color-mix(in srgb,var(--abroad) 70%,#000))}
.hero .big{font-size:1.5em;font-weight:700;line-height:1.2}
.hero .sub{opacity:.92;font-size:.9em;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:550;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--abroad)}
.btn.block{width:100%}.btn.sm{min-height:34px;padding:6px 11px;font-size:.88em;border-radius:10px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74em;color:var(--text)}
.qa button svg{width:22px;height:22px;color:var(--accent)}
.bar{height:9px;background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar i.ok{background:var(--home)}.bar i.warn{background:var(--travel)}.bar i.over{background:var(--abroad)}
.rule{padding:10px 0;border-top:1px solid var(--line)}.rule:first-of-type{border-top:0;padding-top:2px}
.badge{display:inline-block;font-size:.72em;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:550}
.badge.ok{color:var(--home);border-color:color-mix(in srgb,var(--home) 40%,transparent)}
.badge.warn{color:var(--travel);border-color:color-mix(in srgb,var(--travel) 40%,transparent)}
.badge.over{color:var(--abroad);border-color:color-mix(in srgb,var(--abroad) 40%,transparent)}
.badge.plan{color:var(--plan);border-color:color-mix(in srgb,var(--plan) 40%,transparent)}
.badge.acc{color:var(--accent)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item.planned{border-style:dashed}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.15em;flex:none}
.item .tx{flex:1;min-width:0}.item .t1{font-weight:600}.item .t2{font-size:.84em;color:var(--muted)}
.menu .item{margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:.86em;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ygroup{font-weight:700;margin:16px 2px 8px;color:var(--muted);font-size:.86em;text-transform:uppercase;letter-spacing:.05em}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:.82em;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:max(16px,1em);outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheetWrap.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.shead h2{margin:0;font-size:1.15em;flex:1}
.xbtn{border:0;background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:1.1em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88em;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:.95}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72em;color:var(--muted);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.88em;background:var(--card);border:1px solid var(--line);position:relative;cursor:pointer}
.cal .d.e{visibility:hidden}
.cal .d.home{background:color-mix(in srgb,var(--home) 16%,var(--card))}
.cal .d.abroad{background:color-mix(in srgb,var(--abroad) 22%,var(--card))}
.cal .d.travel{background:color-mix(in srgb,var(--travel) 26%,var(--card))}
.cal .d.plan{background:color-mix(in srgb,var(--plan) 16%,var(--card));border-style:dashed}
.cal .d.out{opacity:.45}
.cal .d.today{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.cal .d .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78em;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;font-size:.7em;line-height:1.25}
.th .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--muted)}
.th .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1}
.mini{display:flex;gap:6px;flex-wrap:wrap}.mini .th{width:76px;aspect-ratio:3/4}
.hbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.88em}
.hbar .nm{width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:7px}
.hbar .vl{width:24%;text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.62em;color:var(--muted);gap:3px}
.vbars div i{width:100%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:7;display:flex;align-items:center;justify-content:center}
details.g{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
details.g summary{padding:13px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.g summary::-webkit-details-marker{display:none}
details.g summary:after{content:"›";margin-left:auto;color:var(--muted);font-size:1.3em;transition:transform .2s}
details.g[open] summary:after{transform:rotate(90deg)}
details.g .gb{padding:0 0 14px;font-size:.94em}
details.g .gb p{margin:6px 0}details.g .gb ul,details.g .gb ol{margin:6px 0;padding-left:20px}details.g .gb li{margin:4px 0}
.note{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
.warnbox{background:color-mix(in srgb,var(--travel) 12%,var(--card));border:1px solid color-mix(in srgb,var(--travel) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:.88em;margin:8px 0}
.copy{text-align:center;color:var(--muted);font-size:.76em;margin:22px 0 6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
table.t{width:100%;border-collapse:collapse;font-size:.84em}
table.t th,table.t td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-size:.72em;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:5px}
.themes button.on{border-color:var(--accent)}
.themes button i{width:34px;height:22px;border-radius:7px;display:block;border:1px solid rgba(0,0,0,.08)}
#viewer{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vt{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff;align-items:center}
#viewer .vt button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px}
#viewer .vi{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
#viewer img{max-width:100%;max-height:100%}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock.on{display:flex}
#lock .dots{display:flex;gap:14px}#lock .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}#lock .dots i.f{background:var(--accent)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
#lock .pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.5em}
#print{display:none}
@media print{
 body.printing>*:not(#print){display:none!important}
 body.printing{background:#fff!important}
 body.printing #print{display:block;color:#000;font:11pt/1.4 -apple-system,"Segoe UI",Arial,sans-serif}
}
#print h1{font-size:18pt;margin:0 0 4px}#print h2{font-size:13pt;margin:18px 0 6px;border-bottom:1.5px solid #333;padding-bottom:3px}
#print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4px 0}
#print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
#print th{background:#eef2f5}
#print .ph{display:inline-block;width:31%;margin:0 1% 10px;vertical-align:top;page-break-inside:avoid;font-size:8.5pt}
#print .ph img{width:100%;border:1px solid #ccc}
#print .meta{color:#444;font-size:9.5pt}
@media (min-width:700px){.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="lock"></div>
<header id="top"><div id="backWrap"></div><h1 id="title">Дни ВНЖ</h1><div id="topR"></div></header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="viewer"><div class="vt"><button data-a="vClose">Закрыть</button><span class="sp"></span><button data-a="vShare">Поделиться</button></div><div class="vi"><img id="vImg" alt=""></div></div>
<div id="toast"></div>
<div id="print"></div>
<script>
'use strict';
/* © Елена Кирсанова. Все права защищены. Копирование, изменение и распространение кода без письменного разрешения правообладателя запрещены. */
const APP='Дни ВНЖ',VER='1.0',OWNER='Елена Кирсанова';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const ds=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const TD=()=>dn(todayS());
const fd=s=>s?s.split('-').reverse().join('.'):'—';
const fdn=n=>fd(ds(n));
const addY=(s,y)=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a+y,b-1,c)/864e5)};
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MSH=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;if(n>10&&n<20)return c;if(k>1&&k<5)return b;if(k===1)return a;return c};
const dd=n=>n+' '+plural(n,'день','дня','дней');

const DB={d:null,

 tx(st,mode,fn){return new Promise((ok,no)=>{const t=DB.d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>ok(q?q.result:undefined);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
 get(st,k){return DB.tx(st,'readonly',s=>s.get(k))},
 put(st,k,v){return DB.tx(st,'readwrite',s=>s.put(v,k))},
 del(st,k){return DB.tx(st,'readwrite',s=>s.delete(k))},
 keys(st){return DB.tx(st,'readonly',s=>s.getAllKeys())},
 clear(st){return DB.tx(st,'readwrite',s=>s.clear())}};

const byDep=(a,b)=>a.dep<b.dep?-1:a.dep>b.dep?1:0;
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
function trackStart(){const p=S.profile;if(p.trackFrom)return dn(p.trackFrom);if(p.permitStart)return dn(p.permitStart);const t=S.trips.filter(x=>!x.planned).map(x=>dn(x.dep));return t.length?Math.min(...t):TD()}
function statusMap(trips,withPlan){const m=new Map(),T=TD();
 for(const t of trips){if(t.planned&&!withPlan)continue;if(!t.dep)continue;const a=dn(t.dep);const open=!t.ret;const b=open?Math.max(a,t.planned?a:T):dn(t.ret);
  for(let d=a;d<=b;d++){const tr=d===a||(!open&&d===b);const st=tr?'travel':'abroad';const prev=m.get(d);
   if(!prev||(prev.s==='travel'&&st==='abroad'))m.set(d,{s:st,t,z:!!t.schengen,p:!!t.planned})}}
 return m}
const absent=e=>!!e&&(e.s==='abroad'||(e.s==='travel'&&S.settings.travelAs==='abroad'));
function mapNow(withPlan){return statusMap(S.trips,withPlan)}
function countRange(m,a,b){const r={home:0,abroad:0,travel:0,present:0,absent:0,days:Math.max(0,b-a+1)};for(let d=a;d<=b;d++){const e=m.get(d);r[e?e.s:'home']++;if(absent(e))r.absent++;else r.present++}return r}
function tripInfo(t){const T=TD();const a=dn(t.dep),b=t.ret?dn(t.ret):Math.max(a,T);const open=!t.ret;const travel=open?1:(a===b?1:2);const full=open?Math.max(0,b-a):Math.max(0,b-a-1);const abs=S.settings.travelAs==='abroad'?full+travel:full;const docs=S.docs.filter(x=>x.tripId===t.id).length;return{a,b,open,travel,full,abs,docs,total:b-a+1}}

function evalAll(m,R,o={}){
 const A=Math.min(trackStart(),R-1900);const n=R-A+1;
 const ab=new Uint8Array(n),Pa=new Int32Array(n+1),Pz=new Int32Array(n+1);
 for(let i=0;i<n;i++){const e=m.get(A+i);ab[i]=absent(e)?1:0;Pa[i+1]=Pa[i]+ab[i];Pz[i+1]=Pz[i]+(e&&e.z?1:0)}
 const cnt=(P,a,b)=>{a=Math.max(a,A);b=Math.min(b,R);return b<a?0:P[b-A+1]-P[a-A]};
 const st=(v,l)=>v>l?'over':v>=l*.8?'warn':'ok';
 return S.rules.filter(r=>r.on).map(r=>{const res={r,limit:+r.limit||0};
  if(r.type==='consec'){const ce=o.curEnd??R;let best=0,bEnd=0,run=0,cr=0;for(let i=0;i<n;i++){if(ab[i]){run++;if(run>best){best=run;bEnd=A+i}}else run=0;if(A+i===ce)cr=run}
   run=ce>=R?run:cr;res.cur=run;res.best=best;res.bestEnd=bEnd;res.value=o.cur?run:best;res.left=res.limit-run;res.status=st(res.value,res.limit);
   res.text=o.cur?`Отсутствие подряд: ${dd(run)} из ${res.limit}`:`Максимум подряд: ${dd(best)} из ${res.limit}`+(run?` · сейчас ${dd(run)}`:'');}
  else if(r.type==='period'){const P=+r.period||1826,ps=S.profile.permitStart,anc=r.anchor==='start'&&ps;
   const win=d=>{if(anc){const s0=dn(ps);const k=Math.max(0,Math.floor((d-s0)/P));return[s0+k*P,s0+k*P+P-1]}return[d-P+1,d]};
   let[a,b]=win(R);let v=cnt(Pa,a,Math.min(b,R));
   if(o.zFrom!=null){if(anc){for(let d=o.zFrom,g=0;g<20;g++){const[wa,wb]=win(d);const c=cnt(Pa,wa,Math.min(wb,R));if(c>v){v=c;a=wa;b=wb}if(wb>=R)break;d=wb+1}}
    else for(let d=o.zFrom;d<=R;d++){const c=cnt(Pa,d-P+1,d);if(c>v){v=c;a=d-P+1;b=d}}}
   res.value=v;res.from=a;res.to=b;res.left=res.limit-res.value;res.status=st(res.value,res.limit);
   res.text=`Отсутствие: ${dd(res.value)} из ${res.limit} · окно ${fdn(a)} — ${fdn(b)}`;}
  else if(r.type==='zone'){const P=+r.period||180;const val=d=>cnt(Pz,d-P+1,d);res.value=val(Math.min(R,o.zoneAt??R));let mx=res.value,mxd=R;
   if(o.zFrom!=null){mx=0;for(let d=o.zFrom;d<=R;d++){const v=val(d);if(v>mx){mx=v;mxd=d}}res.value=mx}
   res.maxDay=mxd;res.left=res.limit-res.value;res.status=st(res.value,res.limit);res.text=`В зоне за ${P} дн.: ${dd(res.value)} из ${res.limit}`;}
  else if(r.type==='minyear'){const y=ds(R).slice(0,4);const a=dn(y+'-01-01'),b=dn(y+'-12-31');const end=o.fullYear?b:Math.min(b,R);
   const abs=cnt(Pa,Math.max(a,A),end);const span=end-a+1;res.value=span-abs;const rest=o.fullYear?0:b-R;
   res.status=res.value>=res.limit?'ok':(res.value+rest<res.limit?'over':'prog');res.left=res.limit-res.value;
   res.text=`В стране в ${y} г.: ${dd(res.value)} из ${res.limit}`+(res.status==='prog'?` · нужно ещё ${dd(res.left)}`:'');}
  res.pct=res.limit?Math.min(1.2,res.value/res.limit):0;return res})}

function latestReturn(draft,others){
 const a=dn(draft.dep);
 const ok=ret=>{const t={...draft,ret:ds(ret),planned:true};const m=statusMap([...others,t],true);
  const rs=evalAll(m,ret,{cur:true,curEnd:S.settings.travelAs==='abroad'?ret:ret-1,zFrom:a});
  return rs.every(x=>x.r.type==='minyear'||x.status!=='over')};
 if(!ok(a))return null;let lo=a,hi=a+1100;if(ok(hi))return hi;
 while(hi-lo>1){const mid=(lo+hi)>>1;if(ok(mid))lo=mid;else hi=mid}return lo}

function coverage(a,b){const m=mapNow(false);const out=[];if(b<a)return out;let y=+ds(a).slice(0,4),mo=+ds(a).slice(5,7);
 for(let g=0;g<400;g++){const first=dn(`${y}-${pad(mo)}-01`);const next=mo===12?dn(`${y+1}-01-01`):dn(`${y}-${pad(mo+1)}-01`);const s=Math.max(a,first),e=Math.min(b,next-1);if(s>b)break;
  const c=countRange(m,s,e);const key=`${y}-${pad(mo)}`;const docs=S.docs.filter(x=>x.date&&x.date.slice(0,7)===key).length;out.push({key,y,mo,...c,docs});mo++;if(mo>12){mo=1;y++}}
 return out}

function loadImage(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Не удалось открыть изображение'))};i.src=u})}
async function processFile(f){
 if(f.type&&f.type.startsWith('image/')){try{const img=await loadImage(f);const w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,1800/Math.max(w,h));const cw=Math.round(w*k),ch=Math.round(h*k);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cw,ch);g.drawImage(img,0,0,cw,ch);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const tk=Math.min(1,360/Math.max(cw,ch));const t=document.createElement('canvas');t.width=Math.round(cw*tk);t.height=Math.round(ch*tk);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
  return{id:uid(),blob,mime:'image/jpeg',w:cw,h:ch,name:(f.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',thumb:t.toDataURL('image/jpeg',.7)}}catch(e){}}
 return{id:uid(),blob:f,mime:f.type||'application/octet-stream',w:0,h:0,name:f.name||'file',thumb:''}}
async function storeFile(p){await DB.put('files',p.id,{blob:p.blob,mime:p.mime,w:p.w,h:p.h,name:p.name});if(p.thumb)await DB.put('files','t:'+p.id,p.thumb);return{id:p.id,mime:p.mime,w:p.w,h:p.h,name:p.name}}
async function removeFile(id){await DB.del('files',id);await DB.del('files','t:'+id)}
async function fillThumbs(root=document){for(const el of $$('[data-th]',root)){const id=el.dataset.th;el.removeAttribute('data-th');const t=await DB.get('files','t:'+id);if(t)el.src=t;else{const f=await DB.get('files',id);if(f&&f.mime==='application/pdf')el.replaceWith(Object.assign(document.createElement('div'),{className:'pdf',textContent:'PDF'}));else el.replaceWith(Object.assign(document.createElement('div'),{className:'pdf',textContent:'Файл'}))}}}
const blobToDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
const dataURLToBlob=u=>{const[h,d]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})};

/* ---------- Обзор ---------- */
function ruleRow(x){const cls=x.status==='prog'?'':x.status;const lab={ok:'в норме',warn:'близко к лимиту',over:x.r.type==='minyear'?'не набрать':'превышено',prog:'в процессе'}[x.status];
 return`<div class="rule"><div class="row"><b class="sp" style="font-weight:600">${esc(x.r.name)}</b><span class="badge ${cls}">${lab}</span></div><div class="bar"><i class="${cls}" style="width:${Math.min(100,x.pct*100).toFixed(1)}%"></i></div><div class="small muted">${esc(x.text)}</div></div>`}
function deadlineList(){const p=S.profile,T=TD(),L=[];
 const add=(name,d,sub)=>{if(d!=null&&!isNaN(d))L.push({name,d,left:d-T,sub})};
 if(p.cardTo){const e=dn(p.cardTo);add('Карта ВНЖ действует до',e);const a=e-(+p.renewFrom||60),b=e-(+p.renewTo||14);
  let sub=T<a?`окно откроется через ${dd(a-T)}`:T<=b?`окно открыто, осталось ${dd(b-T)}`:T<=e?'окно закрыто — срочно в миграцию':'карта истекла';
  L.push({name:`Подача на продление: ${fdn(a)} — ${fdn(b)}`,d:b,left:b-T,sub,win:[a,b]})}
 if(p.permitStart){add(`${p.pmzhYears||5} лет ВНЖ — право на ПМЖ`,addY(p.permitStart,+p.pmzhYears||5),'подавать минимум за 3–4 месяца до окончания текущей карты')}
 if(p.passportTo)add('Загранпаспорт действует до',dn(p.passportTo),'менять заранее: карта ВНЖ привязана к паспорту');
 if(p.insuranceTo)add('Медстраховка до',dn(p.insuranceTo));
 for(const x of S.deadlines)if(x.date)add(x.name,dn(x.date),x.note);
 return L.sort((a,b)=>a.d-b.d)}
function dlRow(x){const c=x.left<0?'over':x.left<=30?'warn':'ok';const l=x.left<0?`прошло ${dd(-x.left)}`:x.left===0?'сегодня':`через ${dd(x.left)}`;
 return`<div class="rule"><div class="row"><span class="sp">${esc(x.name)}</span><span class="badge ${c}">${l}</span></div><div class="small muted">${fdn(x.d)}${x.sub?' · '+esc(x.sub):''}</div></div>`}
function vHome(){const p=S.profile,T=TD();
 if(!S.settings.onboarded)return vWelcome();
 const m=mapNow(false),e=m.get(T);const y=new Date().getFullYear();const ys=countRange(m,dn(y+'-01-01'),T);const A=trackStart();const all=countRange(m,A,T);
 const rs=evalAll(m,T,{});let hero;
 if(e&&e.s!=='home'){const t=e.t;const k=T-dn(t.dep)+1;const others=S.trips.filter(x=>x.id!==t.id);const lr=t.ret?null:latestReturn({...t},others);const c=rs.find(x=>x.r.type==='consec');
  hero=`<div class="hero abroad"><div class="small" style="opacity:.85">Сейчас</div><div class="big">За границей · ${esc(t.country||'поездка')}</div><div class="sub">${dd(k)} в поездке с ${fd(t.dep)}${t.ret?' · возвращение '+fd(t.ret):''}</div>${c?`<div class="sub">Можно отсутствовать подряд ещё: <b>${dd(Math.max(0,c.left))}</b></div>`:''}${lr!=null?`<div class="sub">Вернуться не позже: <b>${fdn(lr)}</b></div>`:''}</div>`}
 else{let last=null;for(const t of S.trips)if(!t.planned&&t.ret&&dn(t.ret)<=T&&(!last||t.ret>last.ret))last=t;const since=last?T-dn(last.ret):T-A;
  hero=`<div class="hero"><div class="small" style="opacity:.85">Сейчас</div><div class="big">В стране · ${esc(p.country||'')}</div><div class="sub">${last?`Без выездов ${dd(since)} (с ${fd(last.ret)})`:`Учёт ведётся с ${fdn(A)}`}</div></div>`}
 const cov=coverage(Math.max(A,T-364),T);const covOk=cov.filter(x=>x.present===0||x.docs>0).length;
 const dls=deadlineList().filter(x=>x.left>=-30).slice(0,5);
 const nextPlan=S.trips.filter(t=>t.planned&&dn(t.dep)>=T).sort(byDep)[0];
 const lb=S.meta.lastBackup?T-dn(S.meta.lastBackup):null;const hasData=S.trips.length+S.docs.length+S.expenses.length>0;
 return`${hero}
 <div class="qa"><button data-a="tripNew">${ico('trips','')}Поездка</button><button data-a="docNew">${ico('cam','')}Документ</button><button data-a="expNew">${ico('money','')}Расход</button><button data-a="sub" data-id="planner">${ico('plan','')}Планировщик</button></div>
 ${hasData&&(lb===null||lb>14)?`<div class="warnbox">${lb===null?'Резервная копия ещё ни разу не сохранялась.':'Последняя резервная копия — '+dd(lb)+' назад.'} Фото и данные хранятся только на этом устройстве. <a href="#" data-a="sub" data-id="backup" style="color:var(--accent)">Сохранить копию</a></div>`:''}
 <div class="card"><h2>${y} год</h2><div class="grid3"><div class="stat"><b class="c-home">${ys.present}</b><span>в стране</span></div><div class="stat"><b class="c-abroad">${ys.abroad}</b><span>за границей</span></div><div class="stat"><b class="c-travel">${ys.travel}</b><span>в дороге</span></div></div>
 <div class="small muted" style="margin-top:9px">С начала учёта (${fdn(A)}): в стране ${dd(all.present)}, отсутствие ${dd(all.absent)}, в дороге ${dd(all.travel)}.</div></div>
 <div class="card"><h2>${ico('rules')}Правила и лимиты <span class="sp"></span><button class="btn sm" data-a="sub" data-id="rules">Настроить</button></h2>${rs.length?rs.map(ruleRow).join(''):'<div class="muted small">Правила выключены.</div>'}</div>
 ${nextPlan?`<div class="card"><h2>${ico('plan')}Запланировано</h2><div class="small">${esc(nextPlan.country||'Поездка')}: ${fd(nextPlan.dep)} — ${fd(nextPlan.ret)} · через ${dd(dn(nextPlan.dep)-T)}</div></div>`:''}
 <div class="card"><h2>${ico('clock')}Сроки <span class="sp"></span><button class="btn sm" data-a="sub" data-id="deadlines">Все</button></h2>${dls.length?dls.map(dlRow).join(''):'<div class="small muted">Укажите даты карты ВНЖ, паспорта и страховки в профиле — здесь появятся обратные отсчёты.</div>'}</div>
 <div class="card"><h2>${ico('docs')}Доказательная база</h2><div class="small">За последние 12 месяцев подтверждено документами: <b>${covOk} из ${cov.length}</b> мес.</div><div class="bar"><i class="${covOk===cov.length?'ok':'warn'}" style="width:${cov.length?covOk/cov.length*100:0}%"></i></div><div class="small muted">Цель — хотя бы 1–2 документа на каждый месяц: чек, счёт, выписка, билет.</div></div>`}
function vWelcome(){return`<div class="card"><h2>Добро пожаловать!</h2><p class="small">«${APP}» считает дни в стране, за границей и в дороге, хранит фото билетов и документов, следит за лимитами отсутствия, сроками продления ВНЖ и расходами. Все данные хранятся только на вашем устройстве.</p><p class="small">Для начала заполните основное — остальное можно дополнить позже в «Ещё → Профиль».</p></div>
 <div class="card"><label class="f"><span>Страна ВНЖ</span><input type="text" id="w_country" list="dlC" value="${esc(S.profile.country)}"></label>
 <label class="f"><span>Дата начала первого ВНЖ (для 5-летнего срока ПМЖ)</span><input type="date" id="w_start"></label>
 <label class="f"><span>Текущая карта ВНЖ действует до</span><input type="date" id="w_to"></label>
 <label class="f"><span>Вести учёт дней с даты (если пусто — с даты ВНЖ)</span><input type="date" id="w_track"></label>
 <label class="f"><span>Валюта расходов</span><select id="w_cur">${Object.keys(CUR).map(c=>`<option ${c===S.settings.cur?'selected':''}>${c}</option>`).join('')}</select></label>
 <button class="btn pri block" data-a="welcomeSave">Начать</button></div>${dlC()}<div class="copy">© ${new Date().getFullYear()} ${OWNER}. Все права защищены.</div>`}
const dlC=()=>`<datalist id="dlC">${COUNTRIES.map(c=>`<option value="${c}">`).join('')}</datalist>`;

/* ---------- Поездки ---------- */
function tripCard(t){const i=tripInfo(t);const tr=TRANSPORT[t.transport]||TRANSPORT.other;
 return`<div class="item ${t.planned?'planned':''}" data-a="tripEdit" data-id="${t.id}"><div class="ic">${tr[0]}</div><div class="tx"><div class="t1">${esc(t.country||'Поездка')}${t.city?', '+esc(t.city):''}</div>
 <div class="t2">${fd(t.dep)} — ${t.ret?fd(t.ret):'<b class="c-abroad">ещё не вернулись</b>'}</div>
 <div class="row wrap" style="gap:5px;margin-top:5px">${t.planned?'<span class="badge plan">план</span>':''}<span class="badge">за границей ${i.full}</span><span class="badge">в дороге ${i.travel}</span>${t.schengen?'<span class="badge acc">Шенген</span>':''}${!t.planned?(i.docs?`<span class="badge ok">📎 ${i.docs}</span>`:'<span class="badge warn">нет подтверждений</span>'):''}</div></div></div>`}
function vTrips(){const T=TD();const ts=[...S.trips].sort(byDep).reverse();const years=[...new Set(ts.map(t=>t.dep.slice(0,4)))];
 const list=tripYear==='all'?ts:ts.filter(t=>t.dep.slice(0,4)===tripYear||(t.ret||todayS()).slice(0,4)===tripYear);
 const m=mapNow(false);let sumHtml='';if(tripYear!=='all'){const c=countRange(m,dn(tripYear+'-01-01'),Math.min(T,dn(tripYear+'-12-31')));sumHtml=`<div class="card"><div class="grid3"><div class="stat"><b>${list.filter(t=>!t.planned).length}</b><span>поездок</span></div><div class="stat"><b class="c-abroad">${c.abroad}</b><span>за границей</span></div><div class="stat"><b class="c-travel">${c.travel}</b><span>в дороге</span></div></div></div>`}
 let html=`<div class="chips"><button class="chip ${tripYear==='all'?'on':''}" data-a="tripYear" data-id="all">Все</button>${years.map(y=>`<button class="chip ${tripYear===y?'on':''}" data-a="tripYear" data-id="${y}">${y}</button>`).join('')}</div>${sumHtml}`;
 if(!list.length)html+=`<div class="empty">Поездок пока нет.<br>Нажмите «+», чтобы добавить выезд из страны.</div>`;
 let cy='';for(const t of list){const y=t.dep.slice(0,4);if(tripYear==='all'&&y!==cy){html+=`<div class="ygroup">${y}</div>`;cy=y}html+=tripCard(t)}
 return html+`<button class="fab" data-a="tripNew">+</button>`}
let draft=null;
function tripForm(t){const isNew=!t;t=t||{id:uid(),dep:todayS(),ret:'',country:'',city:'',schengen:false,transport:'plane',purpose:'',note:'',planned:false,retTransport:''};
 draft={kind:'trip',obj:{...t},isNew,files:[]};const linked=isNew?[]:S.docs.filter(d=>d.tripId===t.id);
 openSheet(isNew?'Новая поездка':'Поездка',`
 <div class="grid2"><label class="f"><span>Выезд из страны</span><input type="date" id="f_dep" value="${t.dep}"></label><label class="f"><span>Возвращение</span><input type="date" id="f_ret" value="${t.ret||''}"></label></div>

 <div class="grid2"><label class="f"><span>Страна</span><input type="text" id="f_country" list="dlC" value="${esc(t.country)}" placeholder="Например, Греция"></label><label class="f"><span>Город</span><input type="text" id="f_city" value="${esc(t.city)}"></label></div>

 <div class="grid2"><label class="f"><span>Транспорт</span><select id="f_tr">${Object.entries(TRANSPORT).map(([k,v])=>`<option value="${k}" ${t.transport===k?'selected':''}>${v[0]} ${v[1]}</option>`).join('')}</select></label>
 <label class="f"><span>Цель</span><select id="f_pur">${['','Отдых','Работа / командировка','Семья','Лечение','Учёба','Документы / консульство','Транзит','Другое'].map(x=>`<option ${t.purpose===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
 <label class="f"><span>Заметка (рейс, номер билета, где штамп)</span><textarea id="f_note">${esc(t.note)}</textarea></label>

 ${linked.length?`<div class="mini" style="margin-bottom:8px">${linked.map(d=>`<div class="th" data-a="docOpen" data-id="${d.id}">${d.files[0]?`<img data-th="${d.files[0].id}" alt="">`:'<div class="pdf">—</div>'}</div>`).join('')}</div>`:''}

 $('#f_country').addEventListener('change',e=>{if(SCHENGEN.includes(e.target.value.trim()))$('#f_sch').checked=true});

async function addDraftFiles(files,box){toast('Обработка фото…');for(const f of files){const p=await processFile(f);draft.files.push(p)}drawDraftFiles(box)}
function drawDraftFiles(box){const el=$(box);if(!el)return;el.innerHTML=draft.files.map((p,i)=>`<div class="th">${p.thumb?`<img src="${p.thumb}" alt="">`:'<div class="pdf">PDF</div>'}<button class="x" data-a="dfDel" data-id="${i}" data-box="${box}">×</button></div>`).join('')}
function readTrip(){const o=draft.obj;o.dep=$('#f_dep').value;o.ret=$('#f_open').checked?'':$('#f_ret').value;o.country=$('#f_country').value.trim();o.city=$('#f_city').value.trim();o.schengen=$('#f_sch').checked;o.transport=$('#f_tr').value;o.purpose=$('#f_pur').value;o.note=$('#f_note').value.trim();o.planned=$('#f_plan').checked;return o}
async function tripSave(){const o=readTrip();if(!o.dep)return toast('Укажите дату выезда');if(o.ret&&o.ret<o.dep)return toast('Возвращение раньше выезда');if(o.planned&&!o.ret)return toast('Для плана укажите дату возвращения');
 if(!o.ret&&!o.planned&&o.dep>todayS())return toast('Будущую поездку отметьте как запланированную');
 const i=S.trips.findIndex(t=>t.id===o.id);if(i>=0)S.trips[i]=o;else S.trips.push(o);
 for(const p of draft.files){const meta=await storeFile(p);S.docs.push({id:uid(),type:'Билет',date:o.dep,title:`Билет: ${o.country||'поездка'}`,tripId:o.id,note:'',files:[meta]})}
 save();closeSheet();render();toast('Поездка сохранена')}

 for(let d=first;d<=last;d++){const e=m.get(d);let c=e?(e.p?'plan':e.s):'home';if(d>T&&!e)c='out';if(d<A&&!e)c='out';cells+=`<div class="d ${c} ${d===T?'today':''}" data-a="day" data-id="${d}">${d-first+1}${docDays.has(ds(d))?'<i class="dot"></i>':''}</div>`}
 const mm=mapNow(false);const c=countRange(mm,Math.max(first,A),Math.min(last,T));const yc=countRange(mm,Math.max(dn(calY+'-01-01'),A),Math.min(dn(calY+'-12-31'),T));
 return`<div class="card"><div class="row" style="margin-bottom:10px"><button class="btn sm" data-a="calNav" data-id="-1">‹</button><b class="sp" style="text-align:center;font-size:1.05em">${MONTHS[calM]} ${calY}</b><button class="btn sm" data-a="calNav" data-id="1">›</button></div>

 <div class="row" style="margin-top:10px"><button class="btn sm" data-a="calToday">Сегодня</button></div></div>
 <div class="card"><h2>${MONTHS[calM]}</h2><div class="grid3"><div class="stat"><b class="c-home">${c.present}</b><span>в стране</span></div><div class="stat"><b class="c-abroad">${c.abroad}</b><span>за границей</span></div><div class="stat"><b class="c-travel">${c.travel}</b><span>в дороге</span></div></div></div>

const G=(t,b,open)=>`<details class="g" ${open?'open':''}><summary>${t}</summary><div class="gb">${b}</div></details>`;
function vGuide(){return G('1. Установка на телефон',`<p><b>iPhone / iPad:</b></p><ol><li>Откройте приложение в браузере <b>Safari</b>.</li><li>Нажмите кнопку «Поделиться» (квадрат со стрелкой вверх).</li><li>Прокрутите и выберите «На экран „Домой“» → «Добавить».</li><li>На экране появится иконка «Дни ВНЖ». Запускайте приложение только с неё — так оно работает как обычное приложение и без интернета.</li></ol><p><b>Android:</b> откройте в Chrome → меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p><div class="note">Данные хранятся внутри установленного приложения. Если открыть его в браузере отдельно — там будет пустая копия. Всегда пользуйтесь иконкой.</div>`,true)
+G('2. Первый запуск и профиль',`<p>При первом запуске укажите страну ВНЖ, дату первого ВНЖ, срок действия карты и дату начала учёта. Позже всё можно дополнить в «Ещё → Профиль и ВНЖ»: ФИО (попадёт в отчёты), основание, даты паспорта и страховки, окно подачи на продление (по умолчанию за 60–14 дней до окончания карты).</p><p><b>Дата первого ВНЖ</b> важна: от неё считаются 5-летние периоды для ПМЖ и дата, когда возникает право подать на ПМЖ.</p>`)
+G('3. Как считаются дни',`<ul><li><b>В стране</b> — все дни, когда вы не в поездке.</li><li><b>В дороге</b> — день выезда и день возвращения каждой поездки.</li><li><b>За границей</b> — полные дни между выездом и возвращением.</li></ul><p>Пример: выезд 10 мая, возвращение 15 мая → 2 дня в дороге (10 и 15) и 4 дня за границей (11–14).</p><p>Как учитывать дни в дороге, выбирается в «Правилах подсчёта»: <b>как дни в стране</b> (обычная практика — вы физически были в стране часть дня) или <b>как отсутствие</b> (строгий режим, если ваша миграционная служба считает так). Для Шенгена 90/180 дни въезда и выезда всегда идут в счёт пребывания в зоне — так считает официальный калькулятор ЕС.</p><p>Если вы сейчас за границей и дату возвращения ещё не знаете — отметьте «Ещё не вернулась(-ся)»: дни будут считаться по сегодняшний, а на «Обзоре» появится крайняя безопасная дата возвращения.</p>`)
+G('4. Поездки',`<ol><li>Вкладка «Поездки» → «+».</li><li>Даты выезда и возвращения, страна (из подсказок), транспорт, цель, заметка (номер рейса, где стоит штамп).</li><li>«Страна Шенгена» ставится автоматически для стран зоны — эти дни учитываются в правиле 90/180.</li><li>Сразу прикрепите фото билетов и посадочных — они сохранятся как документы, связанные с поездкой.</li></ol><p>Карточка поездки показывает дни за границей, в дороге и количество подтверждений. Метка <span class="badge warn">нет подтверждений</span> подскажет, к каким поездкам ещё нет билетов.</p><p><b>Запланированные поездки</b> (галочка «Запланированная») не входят в фактические дни, но учитываются в планировщике и видны в календаре пунктиром.</p>`)
+G('5. Календарь',`<p>Каждый день окрашен: зелёный — в стране, красный — за границей, оранжевый — в дороге, синий пунктир — план. Точка — есть документ за этот день. Нажмите на день, чтобы увидеть детали, добавить документ на эту дату или начать поездку с неё. Под календарём — итоги месяца и года.</p>`)
+G('6. Документы и фото — доказательства присутствия',`<p>Миграционная служба может запросить подтверждение, что вы действительно жили в стране. Лучшие доказательства:</p><ul><li>билеты, посадочные талоны, штампы в паспорте — подтверждают даты выездов;</li><li>чеки из магазинов и аптек, оплаты картой, выписки из банка — подтверждают присутствие по датам;</li><li>счета за электричество, воду, интернет, договор аренды;</li><li>визиты к врачу, справки, документы из общины.</li></ul><p>Нажмите «+» → сфотографируйте документ или выберите фото/PDF → укажите тип, дату, название. Фото автоматически сжимаются, чтобы не занимать много места.</p><p>Блок <b>«Подтверждение присутствия»</b> показывает месяцы, где вы были в стране, но нет ни одного документа — нажмите на месяц, чтобы сразу добавить документ. Цель — минимум 1–2 документа каждый месяц.</p>`)
+G('7. Правила и лимиты',`<p>На «Обзоре» для каждого правила — шкала: зелёная — в норме, оранжевая — использовано 80% лимита и больше, красная — превышено.</p><ul><li><b>Отсутствие подряд</b> — самая длинная поездка и текущая (если вы за границей).</li><li><b>Отсутствие за 5 лет</b> — сумма дней отсутствия в текущем 5-летнем цикле от даты первого ВНЖ (или скользящее окно).</li><li><b>Шенген 90/180</b> — дни в других странах Шенгена за последние 180 дней.</li><li><b>183 дня</b> — дни в стране за календарный год (налоговое резидентство).</li></ul><p>Лимиты и периоды можно изменить и добавить свои правила — например, для ВНЖ другой страны.</p>`)
+G('8. Планировщик поездки',`<p>«Обзор» → «Планировщик» или «Ещё → Планировщик». Введите даты будущей поездки до покупки билетов — приложение покажет, не нарушит ли она правила, и рассчитает <b>крайнюю дату возвращения</b>. Результат можно сохранить как запланированную поездку. У сохранённой поездки есть кнопка «Проверить лимиты».</p>`)
+G('9. Сроки, напоминания, чек-лист',`<p>«Сроки» — обратный отсчёт до окончания карты, окна подачи на продление, 5 лет ВНЖ, окончания паспорта и страховки, плюс ваши собственные даты. Кнопка «Добавить сроки в Календарь» создаёт файл календаря — откройте его, и iPhone добавит события с напоминаниями за 30 и 7 дней.</p><p>«Чек-лист продления» — отмечайте собранные документы, добавляйте свои пункты; перед следующим продлением снимите отметки.</p>`)
+G('10. Расходы на ВНЖ и аналитика',`<p>Вкладка «Расходы» → «+»: дата, статья (госпошлины, карта, страховка, нотариус и переводы, аренда, адвокат, банк, дорога…), сумма и валюта, фото чека. Если валюта отличается от основной, укажите курс — он запомнится. Курс лева к евро фиксированный и подставляется сам.</p><p>Аналитика: итог за год или за всё время, средний расход в месяц, распределение по статьям и график по месяцам или годам. Так видна реальная стоимость каждого года ВНЖ. Статьи расходов меняются в «Настройках».</p>`)

 ruleAdd:()=>{const t=$('#nr_type').value;const n=$('#nr_name').value.trim()||'Моё правило';S.rules.push({id:uid(),on:true,custom:true,name:n,type:t,limit:t==='zone'?90:t==='minyear'?183:180,period:t==='zone'?180:t==='period'?365:0,anchor:'rolling',note:''});save();render()},
 ruleDel:id=>{S.rules=S.rules.filter(r=>r.id!==id);save();render()},rulesReset:()=>{if(confirm('Вернуть стандартные правила? Свои правила будут удалены.')){S.rules=defRules();save();render()}},
 planCheck:()=>planCheck(),planSave:()=>{const dep=$('#pl_dep').value,ret=$('#pl_ret').value;if(!dep||!ret)return toast('Укажите обе даты');S.trips.push({id:uid(),dep,ret,country:$('#pl_c').value.trim(),city:'',schengen:$('#pl_s').checked,transport:'plane',purpose:'',note:'',planned:true});save();toast('Поездка запланирована');go('trips')},
 dlAdd:()=>{const n=$('#dl_n').value.trim(),d=$('#dl_d').value;if(!n||!d)return toast('Название и дата');S.deadlines.push({id:uid(),name:n,date:d});save();render()},dlDel:id=>{S.deadlines=S.deadlines.filter(x=>x.id!==id);save();render()},ics:exportIcs,
 clOn:(id,el)=>{S.checklist.find(x=>x.id===id).on=el.checked;save();render()},clDel:id=>{S.checklist=S.checklist.filter(x=>x.id!==id);save();render()},
 clAdd:()=>{const t=$('#cl_t').value.trim();if(!t)return;S.checklist.push({id:uid(),t,on:false});save();render()},clReset:()=>{S.checklist.forEach(x=>x.on=false);save();render()},clDefault:()=>{if(confirm('Заменить список стандартным?')){S.checklist=defChecklist();save();render()}},
 xPreset:id=>{const T=TD(),y=new Date().getFullYear();let a=trackStart(),b=T;if(id==='year')a=dn(y+'-01-01');if(id==='last'){a=dn((y-1)+'-01-01');b=dn((y-1)+'-12-31')}if(id==='12')a=T-364;if(id==='5y')a=S.profile.permitStart?dn(S.profile.permitStart):T-1825;$('#x_a').value=ds(a);$('#x_b').value=ds(b)},
 xXls:()=>exportXlsx().catch(e=>toast('Ошибка: '+e.message)),xWord:()=>exportDocx().catch(e=>toast('Ошибка: '+e.message)),xPdf:()=>exportPdf().catch(e=>toast('Ошибка: '+e.message)),
 bkSave:()=>backupSave().catch(e=>toast('Ошибка: '+e.message)),
 wipe:async()=>{if(confirm('Удалить ВСЕ данные и фото без возможности восстановления?')&&confirm('Вы сохранили резервную копию? Удаляем?')){await DB.clear('files');S=defState();await saveNow();applySettings();go('home')}},
 theme:id=>{S.settings.theme=id;applySettings();save();render()},tcReset:()=>{S.settings.textColor='';applySettings();save();render()},acReset:()=>{S.settings.accent='';applySettings();save();render()},
 catAdd:()=>{S.settings.cats.push({id:uid(),n:'Новая статья'});save();render()},catDel:id=>{if(S.expenses.some(x=>x.cat===id))return toast('Эта статья используется в расходах');S.settings.cats=S.settings.cats.filter(c=>c.id!==id);save();render()},
 pinOn:async()=>{const v=$('#s_pin').value.trim();if(!/^\d{4,6}$/.test(v))return toast('PIN — от 4 до 6 цифр');S.settings.pinHash=await hash(v);save();render();toast('PIN включён')},
 pinOff:()=>{if(confirm('Отключить PIN?')){S.settings.pinHash='';save();render()}},onboardAgain:()=>{S.settings.onboarded=false;save();go('home')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!ACT[a])return;
 if(el.tagName==='INPUT'&&(el.type==='checkbox'||el.type==='radio')){ACT[a](el.dataset.id,el);return}
 if(el.tagName==='A')e.preventDefault();if(a==='docOpen'&&$('#sheetWrap').classList.contains('on')&&draft&&draft.kind==='trip'){closeSheet()}
 ACT[a](el.dataset.id,el)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='dq'){docFilter.q=t.value;clearTimeout(ACT._q);ACT._q=setTimeout(()=>{render();const q=$('#dq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}},350)}
 if(t.id==='s_fs'){S.settings.fs=+t.value;$('#fsv').textContent=t.value;applySettings();save()}
 if(t.id==='s_tc'){S.settings.textColor=t.value;applySettings();save()}if(t.id==='s_ac'){S.settings.accent=t.value;applySettings();save()}
 if(t.dataset.cat){const c=S.settings.cats.find(x=>x.id===t.dataset.cat);if(c){c.n=t.value;save()}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='dtype'){docFilter.type=t.value;render()}if(t.id==='dyear'){docFilter.year=t.value;render()}
 if(t.id==='s_font'){S.settings.font=t.value;applySettings();save()}if(t.id==='s_hc'){S.settings.contrast=t.checked;applySettings();save()}if(t.id==='s_cur'){S.settings.cur=t.value;save()}
 if(t.dataset.rf){const r=S.rules.find(x=>x.id===t.dataset.id);r[t.dataset.rf]=t.tagName==='SELECT'?t.value:(+t.value||0);save()}
 if(t.id==='bk_file'&&t.files[0])backupLoad(t.files[0]).catch(er=>toast('Ошибка: '+er.message))});

/* ---------- Запуск ---------- */
(async()=>{try{await DB.open();const st=await DB.get('kv','state');if(st){const d=defState();S=Object.assign(d,st);S.profile=Object.assign(d.profile,st.profile);S.settings=Object.assign(d.settings,st.settings);S.meta=Object.assign(d.meta,st.meta)}}catch(e){toast('Хранилище недоступно: '+e.message)}
 applySettings();render();if(S.settings.pinHash)showLock();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 setInterval(()=>{if(route.tab==='home'&&!route.sub&&!$('#sheetWrap').classList.contains('on'))render()},3600000)})();
</script>
</body>
